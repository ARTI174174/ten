<script>
'use strict';
/* ===== ЭХО: детерминированное физическое ядро (фиксированный шаг 1/60) ===== */
const DT=1/60, G=24, RUN=6, ACC=90, DEC=60, CROUCH_K=.35, CYCLE=600;
const COYOTE=5, BUF=6, PUSH=1.5, COLS=16, ROWS=18, PW=.8, EPS=1e-6, H_STAND=2, H_CROUCH=1;
const JUMP_V=7.35; // подобрано тестом: подъём ≈1.05–1.1 блока (< 2)
const M_L=1,M_R=2,M_J=4,M_C=8;
const MAX_CLONES=10;

const bx=e=>({l:e.x-e.w/2,r:e.x+e.w/2,t:e.y-e.h,b:e.y});
const ov=(a,b)=>a.l<b.r-EPS&&a.r>b.l+EPS&&a.t<b.b-EPS&&a.b>b.t+EPS;

function buildGrid(def){
  const g=[];for(let r=0;r<ROWS;r++)g.push(new Uint8Array(COLS));
  for(const [x,y,w,h] of def.solids)for(let r=y;r<y+h;r++)for(let c=x;c<x+w;c++)if(r>=0&&r<ROWS&&c>=0&&c<COLS)g[r][c]=1;
  return g;
}
function solidTile(w,c,r){ if(c<0||c>=COLS)return true; if(r<0||r>=ROWS)return false; return w.grid[r][c]===1; }
function doorRect(d){return{l:d.x,r:d.x+d.w,t:d.y,b:d.y+d.h*(1-d.open)};}
function platRect(p){return{l:p.x,r:p.x+p.w,t:p.y,b:p.y+p.h};}

function gather(w,b,self){
  const out=[];
  const c0=Math.floor(b.l+EPS),c1=Math.ceil(b.r-EPS)-1,r0=Math.floor(b.t+EPS),r1=Math.ceil(b.b-EPS)-1;
  for(let c=c0;c<=c1;c++)for(let r=r0;r<=r1;r++)if(solidTile(w,c,r))out.push({l:c,r:c+1,t:r,b:r+1,owner:null});
  for(const d of w.doors){ if(d.open<.999){const q=doorRect(d);if(ov(b,q)){q.owner=d;out.push(q);}} }
  for(const p of w.plats){const q=platRect(p);if(ov(b,q)){q.owner=p;out.push(q);}}
  for(const c of w.crates){ if(c===self)continue;const q=bx(c);if(ov(b,q)){q.owner=c;out.push(q);} }
  return out;
}

function carryRiders(w,o,dx,dy){
  for(const r of w.movers){
    if(r.standingOn!==o)continue;
    if(dx){ if(r.kind==='crate')moveCrateX(w,r,dx); else moveX(w,r,dx,false,0); }
    if(dy){ r.y+=dy; carryRiders(w,r,0,dy); }
  }
}
function moveX(w,e,dx,counting,dir){
  if(!dx)return;
  const sx=e.x; e.x+=dx;
  const list=gather(w,bx(e),e);
  for(const s of list){
    if(ov(bx(e),s)){
      e.x = dx>0 ? s.l-e.w/2 : s.r+e.w/2;
      if(counting){
        e.vx=0;
        if(s.owner&&s.owner.kind==='crate'&&dir*dx>0){ e.pushing=true; s.owner.pushers.add(e); s.owner.pushDir=dir>0?1:-1; }
      }
    }
  }
  const real=e.x-sx; if(real)carryRiders(w,e,real,0);
}
function moveCrateX(w,c,dx){
  const sx=c.x; c.x+=dx;
  let blocked=gather(w,bx(c),c).some(s=>ov(bx(c),s));
  if(!blocked) for(const ch of w.chars){ if(ch.dead||ch.standingOn===c)continue; if(ov(bx(c),bx(ch))){blocked=true;break;} }
  if(blocked){c.x=sx;return 0;}
  carryRiders(w,c,dx,0); return dx;
}
function moveY(w,e,dy){
  const pb=e.y; e.y+=dy; const y0=e.y;
  if(dy>=0){
    let best=null;
    for(const s of gather(w,bx(e),e)) if(ov(bx(e),s)&&(!best||s.t<best.t))best=s;
    let top=best?best.t:Infinity, owner=best?best.owner:null, hit=!!best;
    if(e.kind==='char'){
      for(const c of w.chars){
        if(c===e||c.dead||c.standingOn===e)continue;
        const ct=c.y-c.h;
        if(Math.abs(e.x-c.x)<(e.w+c.w)/2-.03 && pb<=ct+1e-4 && y0>=ct-1e-9 && ct<top){top=ct;owner=c;hit=true;}
      }
    }
    if(hit){e.y=top;e.vy=0;e.grounded=true;e.standingOn=owner;}
  } else {
    let best=null;
    for(const s of gather(w,bx(e),e)) if(ov(bx(e),s)&&(!best||s.b>best.b))best=s;
    if(best){e.y=best.b+e.h;e.vy=0;}
  }
  const real=e.y-pb; if(real)carryRiders(w,e,0,real);
}
function canStand(w,e){
  const reg={l:e.x-e.w/2,r:e.x+e.w/2,t:e.y-H_STAND,b:e.y-H_CROUCH};
  if(gather(w,reg,e).some(s=>ov(reg,s)))return false;
  for(const c of w.chars){
    if(c===e||c.dead)continue;
    if(ov(reg,bx(c))&&c.y<=reg.b+1e-3&&c.y>reg.t)return false;
  }
  return true;
}
function kill(w,e){ if(e.dead)return; e.dead=true; e.vx=0; w.ev('death',e); }

function newChar(w,i,rec){
  return{kind:'char',idx:i,rec:rec||null,ri:0,x:w.def.start[0],y:w.def.start[1],w:PW,h:H_STAND,vx:0,vy:0,
    grounded:true,standingOn:null,coyote:0,buf:0,crouched:false,prevMask:0,mask:0,dead:false,face:1,run:0,landT:0,
    pushing:false,deadT:0,stepAcc:0,spawnT:0};
}
function stepChar(w,e,mask){
  e.mask=mask;
  if(e.dead){ e.deadT++; e.vy=Math.min(e.vy+G*DT,20); const g=e.grounded; e.grounded=false;e.standingOn=null; moveY(w,e,e.vy*DT); return; }
  const jp=(mask&M_J)&&!(e.prevMask&M_J); e.prevMask=mask;
  const wantC=!!(mask&M_C);
  if(wantC&&!e.crouched){ e.crouched=true;e.h=H_CROUCH;carryRiders(w,e,0,1);w.ev('crouch',e); }
  else if(!wantC&&e.crouched&&canStand(w,e)){ e.crouched=false;e.h=H_STAND;w.ev('stand',e); }
  const dir=((mask&M_R)?1:0)-((mask&M_L)?1:0);
  const sp=RUN*(e.crouched?CROUCH_K:1);
  const fric=e.standingOn&&e.standingOn.ice?.25:1;
  if(dir){ const a=ACC*(e.grounded?fric:.7)*DT; const d=dir*sp-e.vx; e.vx+=Math.max(-a,Math.min(a,d)); e.face=dir; }
  else { const a=DEC*(e.grounded?fric:.35)*DT; e.vx=e.vx>0?Math.max(0,e.vx-a):Math.min(0,e.vx+a); }
  e.coyote=e.grounded?COYOTE:Math.max(0,e.coyote-1);
  e.buf=jp?BUF:Math.max(0,e.buf-1);
  if(e.buf>0&&e.coyote>0&&!e.crouched){
    e.vy=-JUMP_V;e.coyote=0;e.buf=0;e.grounded=false;e.standingOn=null;w.ev('jump',e);
  } else if(!(mask&M_J)&&e.vy<-2.5) e.vy+=G*DT*1.2;
  e.vy=Math.min(e.vy+G*DT,20);
  e.pushing=false;
  moveX(w,e,e.vx*DT,true,dir);
  const wasG=e.grounded,pvy=e.vy;
  e.grounded=false;e.standingOn=null;
  moveY(w,e,e.vy*DT);
  if(e.grounded&&!wasG&&pvy>3){e.landT=9;w.ev('land',e);}
  if(e.landT>0)e.landT--;
  if(e.grounded&&Math.abs(e.vx)>.5){ e.run+=Math.abs(e.vx)*DT*(e.crouched?1.2:.9); e.stepAcc+=Math.abs(e.vx)*DT; if(e.stepAcc>1.1){e.stepAcc=0;w.ev('step',e);} }
  else if(!e.grounded) e.stepAcc=0;
  if(e.y>ROWS+2)kill(w,e);
}
function recMask(e,frame){
  const ev=e.rec.ev; while(e.ri+1<ev.length&&ev[e.ri+1][0]<=frame)e.ri++; return ev[e.ri][1];
}

function createWorld(def,recs){
  const w={def,grid:buildGrid(def),frame:0,chars:[],crates:[],movers:[],doors:[],buttons:[],plats:[],spikes:[],crystals:[],
    pressed:{},events:[],won:false,exit:{l:def.exit[0],r:def.exit[0]+1.4,t:def.exit[1]-2.2,b:def.exit[1]}};
  w.ev=(t,e)=>w.events.push({t,e});
  for(const c of def.crates||[])w.crates.push({kind:'crate',x:c.x+c.w/2,y:c.y+c.h,w:c.w,h:c.h,need:c.need||1,vx:0,vy:0,pushers:new Set(),pushDir:0,standingOn:null,grounded:false});
  for(const d of def.doors||[])w.doors.push({kind:'door',x:d.x,y:d.y,w:d.w,h:d.h,ids:d.ids,open:0,wasOpen:false});
  for(const b of def.buttons||[])w.buttons.push({...b,down:false});
  for(const p of def.plats||[])w.plats.push({kind:'plat',x0:p.x,y0:p.y,x:p.x,y:p.y,w:p.w,h:p.h||.45,dx:p.dx||0,dy:p.dy||0,speed:p.speed||2,ids:p.ids||null,prog:0});
  for(const s of def.spikes||[])w.spikes.push({...s,active:true});
  for(const c of def.crystals||[])w.crystals.push({x:c[0],y:c[1],got:false});
  recs.forEach((r,i)=>w.chars.push(newChar(w,i,r)));
  w.player=newChar(w,recs.length,null); w.chars.push(w.player);
  w.movers=[...w.chars,...w.crates];
  return w;
}
const allPressed=(w,ids)=>!ids||ids.every(i=>w.pressed[i]);
function stepWorld(w,pm){
  w.events.length=0;
  for(const c of w.crates){c.pushers.clear();c.pushDir=0;}
  for(const p of w.plats){
    const len=Math.hypot(p.dx,p.dy)||1, tgt=allPressed(w,p.ids)?1:0;
    const st=p.speed*DT/len; const old=p.prog;
    p.prog=tgt>old?Math.min(tgt,old+st):Math.max(tgt,old-st);
    const nx=p.x0+p.prog*p.dx, ny=p.y0+p.prog*p.dy, ddx=nx-p.x, ddy=ny-p.y;
    p.x=nx;p.y=ny; if(ddx||ddy)carryRiders(w,p,ddx,ddy);
  }
  for(const d of w.doors){
    const want=allPressed(w,d.ids);
    let no=d.open+(want?1:-1)*2.5*DT; no=Math.max(0,Math.min(1,no));
    if(no<d.open){ const old=d.open; d.open=no; const q=doorRect(d); let blk=false;
      for(const m of w.movers){ if(m.dead)continue; if(ov(bx(m),q)){blk=true;break;} }
      if(blk)d.open=old; } else d.open=no;
    const o=d.open>.5; if(o!==d.wasOpen){d.wasOpen=o;w.ev('door',d);}
  }
  for(const c of w.chars){ if(c.rec)stepChar(w,c,recMask(c,w.frame)); }
  stepChar(w,w.player,pm);
  for(const c of w.crates){
    if(c.pushDir&&c.pushers.size>=c.need){ moveCrateX(w,c,c.pushDir*PUSH*DT); w.ev('push',c); }
    c.vy=Math.min(c.vy+G*DT,20); const pb=c.y; c.y+=c.vy*DT; c.grounded=false;c.standingOn=null;
    let best=null; for(const s of gather(w,bx(c),c))if(ov(bx(c),s)&&(!best||s.t<best.t))best=s;
    if(best){c.y=best.t;c.vy=0;c.grounded=true;c.standingOn=best.owner;}
    const real=c.y-pb; if(real)carryRiders(w,c,0,real);
  }
  for(const k in w.pressed)w.pressed[k]=false;
  for(const b of w.buttons){
    const s={l:b.x+.05,r:b.x+b.w-.05,t:b.y-.3,b:b.y+.02}; let dn=false;
    for(const m of w.movers){ if(m.dead)continue; if(ov(bx(m),s)){dn=true;break;} }
    if(dn!==b.down){b.down=dn;w.ev('btn',b);}
    if(dn)w.pressed[b.id]=true; else if(!(b.id in w.pressed))w.pressed[b.id]=false;
  }
  for(const s of w.spikes){
    s.active=!(s.ids&&s.ids.every(i=>w.pressed[i]));
    if(s.active){ const q={l:s.x+.1,r:s.x+s.w-.1,t:s.y-.5,b:s.y};
      for(const c of w.chars)if(!c.dead&&ov(bx(c),q))kill(w,c); }
  }
  for(const k of w.crystals){ if(k.got)continue;
    for(const c of w.chars){ if(c.dead)continue; if(Math.hypot(c.x-k.x,c.y-c.h/2-k.y)<.8){k.got=true;w.ev('crystal',k);break;} } }
  if(!w.won&&!w.player.dead&&ov(bx(w.player),w.exit)){w.won=true;w.ev('win',w.player);}
  w.frame++;
}

class Session{
  constructor(def){this.def=def;this.recs=[];this.attempts=1;this.begin();}
  begin(){this.world=createWorld(this.def,this.recs);this.rec=[];this.lastMask=-1;this.deadT=0;}
  get cycle(){return this.recs.length+1;}
  tick(mask){
    const w=this.world;
    if(mask!==this.lastMask){this.rec.push([w.frame,mask]);this.lastMask=mask;}
    stepWorld(w,mask);
    if(w.player.dead){ if(++this.deadT>40){this.attempts++;this.begin();return'died';} return null; }
    if(w.won)return'won';
    if(w.frame>=CYCLE)return'cycle_end';
    return null;
  }
  endCycle(){
    const w=this.world;
    if(this.lastMask!==0)this.rec.push([w.frame,0]);
    if(this.recs.length<MAX_CLONES)this.recs.push({ev:this.rec,len:w.frame});
    this.begin();
  }
  restart(){this.recs=[];this.attempts=1;this.begin();}
}

 {name:'МЕХАНИЧЕСКИЙ ЛИФТ',hint:'Успей встать на лифт, пока копия идёт к кнопке',min:2,start:[3.5,16],exit:[13.4,11],

/* ===================== КЛИЕНТ: утилиты, сохранения, звук, частицы ===================== */
const VW=1080,VH=1920,TS=67.5,OX=0,OY=246;
const cv=document.getElementById('c'),g=cv.getContext('2d');
let SC=1,DPR=1,insetB=0,BAR=0;
const FONT="'Trebuchet MS','Segoe UI',Roboto,Arial,sans-serif";
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hex(c){const n=parseInt(c.slice(1),16);return[n>>16,(n>>8)&255,n&255];}
function rgb(a){return'rgb('+a.map(v=>clamp(Math.round(v),0,255)).join(',')+')';}
function mix(a,b,t){const x=hex(a),y=hex(b);return rgb(x.map((v,i)=>lerp(v,y[i],t)));}
function shade(c,k){return rgb(hex(c).map(v=>v*k));}
const CLONE_COL=['#26b8ff','#a15cff','#ff5cc0','#ff4d5a','#ff9f36','#ffd45a'];
function cloneColor(i){const b=CLONE_COL[i%6],k=Math.floor(i/6);return k?shade(b,k%2?.8:1.12):b;}
function rnd(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

/* --- сохранения --- */
const SAVE_KEY='echo_save_v1';
let save={done:{},skin:0,sfx:true,music:true,quality:'auto'};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
const doneCount=()=>Object.keys(save.done).length;
const totalCrystals=()=>Object.values(save.done).reduce((a,d)=>a+(d.crystals||0),0);
const unlocked=i=>i===0||!!save.done[i-1];

/* --- звук (Web Audio, всё синтезируется) --- */
const AU={ctx:null,master:null,mus:null,musTimer:0,
  init(){ if(this.ctx)return; try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();
    this.master=this.ctx.createGain();this.master.gain.value=.7;this.master.connect(this.ctx.destination);
    this.mus=this.ctx.createGain();this.mus.gain.value=.5;this.mus.connect(this.master);}catch(e){} this.resume();},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,d,type,v,slide,delay,dest){ if(!this.ctx)return; const c=this.ctx,t=c.currentTime+(delay||0);
    const o=c.createOscillator(),a=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
    a.gain.setValueAtTime(0.0001,t);a.gain.exponentialRampToValueAtTime(v||.1,t+.01);a.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(a);a.connect(dest||this.master);o.start(t);o.stop(t+d+.05);},
  noise(d,v,fc,delay){ if(!this.ctx)return; const c=this.ctx,t=c.currentTime+(delay||0);
    const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),da=b.getChannelData(0);
    for(let i=0;i<n;i++)da[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1200;
    const a=c.createGain();a.gain.value=v;s.connect(f);f.connect(a);a.connect(this.master);s.start(t);},
  sfx(n,q){ if(!save.sfx||!this.ctx)return; q=q==null?1:q;
    switch(n){

    const sp=(o.sp||60)*(.4+Math.random()*.8); p.a=true;p.x=x+(Math.random()-.5)*(o.jit||0);p.y=y+(Math.random()-.5)*(o.jitY||0);
    p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.m=p.l=(o.life||.5)*(.7+Math.random()*.6);p.s=(o.size||4)*(.6+Math.random()*.7);

function stepParticles(dt){ for(const p of PP){ if(!p.a)continue; p.l-=dt; if(p.l<=0){p.a=false;continue;} p.vy+=p.gv*dt;p.x+=p.vx*dt;p.y+=p.vy*dt; } }

  g.globalAlpha=1;g.globalCompositeOperation='source-over'; }

  drawControls(); }
function drawPause(t){
  renderGame(t,true); g.fillStyle='rgba(2,6,16,.72)';g.fillRect(0,0,VW,VH); panel(150,560,780,860);
  text('ПАУЗА',540,660,86,'#f5f9ff');
  uiBtn('p1',540,800,620,125,'ПРОДОЛЖИТЬ',()=>{gs.paused=false;},{gold:true,fs:48});
  uiBtn('p2',540,950,620,115,'ЗАНОВО',()=>{gs.sess.restart();gs.fx=null;gs.ring=null;gs.paused=false;gs.time=0;gs.hint=0;beginFx();},{fs:44});
  uiBtn('p3',540,1085,620,115,'НАСТРОЙКИ',()=>{retScene='game';scene='settings';},{fs:44});
  uiBtn('p4',540,1220,620,115,'ВЫЙТИ',()=>{gs.paused=false;AU.music(false);scene='levels';},{fs:44}); }
function drawVictory(t){
  renderGame(t,true); g.fillStyle='rgba(2,6,16,.7)';g.fillRect(0,0,VW,VH); vic.t++;
  panel(80,380,920,1130); text('УРОВЕНЬ ПРОЙДЕН!',540,500,72,'#ffd45a'); 
  for(let i=0;i<3;i++){ const k=clamp((vic.t-12-i*14)/14,0,1),on=i<vic.stars; if(k>0)star(540+(i-1)*190,700,i===1?95:80,on,.4+.6*Math.min(1,k)*(1+(1-k)*.4)+(on?Math.sin(t*3+i)*.02:0)); }
  text('Циклов: '+vic.cycles+'   (на 3★ — не больше '+LEVELS[gs.idx].min+')',540,880,36,'#e8f4ff'); text('Твои копии: '+vic.clones,540,950,36,'#e8f4ff');
  const m=Math.floor(vic.time/60),sc=Math.floor(vic.time%60); text('Время: '+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0'),540,1020,36,'#e8f4ff'); text('Кристаллы: '+vic.cr+'/'+vic.crAll,540,1090,36,'#8fe9ff');
  const hasNext=gs.idx+1<LEVELS.length;
  uiBtn('v1',540,1220,640,130,hasNext?'ДАЛЕЕ':'К КАРТЕ',()=>{ if(hasNext)startLevel(gs.idx+1); else scene='levels'; },{green:true,fs:56});
  uiBtn('v2',340,1380,360,110,'ПОВТОРИТЬ',()=>startLevel(gs.idx),{fs:36}); uiBtn('v3',740,1380,300,110,'МЕНЮ',()=>{AU.music(false);scene='menu';},{fs:38});
  if(vic.t%6===0)emit(120+Math.random()*840,420,1,{ang:1.57,spread:.5,sp:140,col:'#ffd45a',life:1.4,size:4,add:true}); drawParticles(); }

/* ---------- ввод ---------- */
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH};}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(_){} AU.init();AU.resume(); if(save.music&&!AU.musTimer&&(scene==='menu'||scene==='levels'))AU.music(true);
  const p=pt(e),st={x:p.x,y:p.y,sx:p.x,sy:p.y,ctrl:-1,btn:null,moved:false}; ptrs.set(e.pointerId,st);
  const b=hitBtn(p.x,p.y); if(b){st.btn=b;return;} if(scene==='game'&&!gs.paused&&!gs.winT)st.ctrl=ctrlAt(p.x,p.y,1.3); });
cv.addEventListener('pointermove',e=>{ const st=ptrs.get(e.pointerId); if(!st)return; e.preventDefault(); const p=pt(e);
  if(scene==='levels'){ lsY=clamp(lsY+(p.y-st.y),-60,420); if(Math.hypot(p.x-st.sx,p.y-st.sy)>16)st.moved=true; }
  st.x=p.x;st.y=p.y; if(scene==='game'&&!gs.paused&&!st.btn&&!gs.winT)st.ctrl=ctrlAt(p.x,p.y,1.35); });
function endPtr(e){ const st=ptrs.get(e.pointerId); if(!st)return; ptrs.delete(e.pointerId);
  if(e.type==='pointerup'&&st.btn&&!st.moved){ const p=pt(e),b=hitBtn(p.x,p.y); if(b&&b.id===st.btn.id){AU.sfx('ui');b.fn();} } }
cv.addEventListener('pointerup',e=>{e.preventDefault();endPtr(e);}); cv.addEventListener('pointercancel',endPtr); cv.addEventListener('lostpointercapture',endPtr);
['contextmenu','gesturestart','dblclick','selectstart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{ if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault(); keys.add(e.code); AU.init();
  if(scene==='game'&&!e.repeat){ if(e.code==='KeyR'||e.code==='KeyE')startReset(); if(e.code==='Escape'||e.code==='KeyP')gs.paused=!gs.paused; } });
addEventListener('keyup',e=>keys.delete(e.code));
function autoPause(){ keys.clear(); ptrs.clear(); if(scene==='game'&&gs&&!gs.paused&&!gs.winT)gs.paused=true; }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){autoPause();if(AU.ctx)AU.ctx.suspend();}else AU.resume(); }); addEventListener('blur',autoPause);

/* ---------- размеры, цикл ---------- */
const probe=document.getElementById('probe');
function resize(){ const iw=innerWidth,ih=innerHeight; let w=iw,h=iw*16/9; if(h>ih){h=ih;w=ih*9/16;}
  DPR=Math.min(2,window.devicePixelRatio||1); cv.style.width=w+'px';cv.style.height=h+'px'; cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR); SC=cv.width/VW;
  BAR=(ih-h)/2; const sb=parseFloat(getComputedStyle(probe).paddingBottom)||0; insetB=Math.max(0,sb-BAR)*(VW/w); }
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,150)); resize();
if(save.quality==='low')Q=0;
let last=0,acc=0,slow=0,fpsAvg=16,autoLow=false;
function frame(ts){ requestAnimationFrame(frame); const dtr=Math.min(.1,(ts-last)/1000||.016);last=ts; T0=ts/1000;
  fpsAvg=fpsAvg*.95+dtr*1000*.05; if(save.quality==='auto'){ if(fpsAvg>26)slow++; else slow=Math.max(0,slow-1); if(slow>150)autoLow=true; Q=autoLow?0:1; } else Q=save.quality==='low'?0:1;
  acc+=dtr; let n=0; while(acc>=DT&&n<4){ if(scene==='game'&&!gs.paused)updateGame(); acc-=DT;n++; } if(n>=4)acc=0;
  stepParticles(dtr); if(confirmReset>0)confirmReset--;
  hitBtns=btns;btns=[]; g.setTransform(SC,0,0,SC,0,0); g.clearRect(0,0,VW,VH); g.globalAlpha=1;
  if(scene==='menu')drawMenu(T0); else if(scene==='levels')drawLevels(T0); else if(scene==='skins')drawSkins(T0); else if(scene==='settings')drawSettings(T0);
  else if(scene==='game'){ if(gs.paused)drawPause(T0); else renderGame(T0,false); } else if(scene==='victory')drawVictory(T0);
  if(scene==='menu'||scene==='levels'||scene==='skins'||scene==='settings'){ if(scene!=='menu')drawParticles(); }
  if(scene==='game'&&gs.paused&&AU.musTimer)AU.music(false); else if(scene==='game'&&!gs.paused&&!AU.musTimer&&save.music&&AU.ctx)AU.music(true); }
requestAnimationFrame(frame);


</script></body></html>
